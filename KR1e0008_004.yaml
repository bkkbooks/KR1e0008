body:
  text: 閔公閔公元年元年春王正月繼弒君不言即位正也親之非父也尊之非君也繼之如君父也者受國焉爾齊人救邢善救邢也夏六月辛酉葬我君莊公莊公葬而後舉諡諡所以成德也於卒事乎加之矣秋八月公及齊侯盟于洛姑盟納季子也季子來歸其曰季子貴之也其曰來歸喜之也冬齊仲孫來其曰齊仲孫外之也其不目而曰仲孫疏之也其言齊以纍桓也閔公二年二年春王正月齊人遷陽夏五月乙酉吉禘于莊公吉禘者不吉者也喪事未畢而舉吉祭故非之也秋八月辛丑公薨不地故也其不書葬不以討母葬子也九月夫人姜氏孫于邾孫之為言猶孫也諱奔也公子慶父出奔莒其曰出絶之也慶父不復見矣冬齊高子來盟其曰來喜之也其曰高子貴之也盟立僖公也不言使何也不以齊侯使高子也十有二月狄入衛鄭棄其師惡其長也兼不反其衆則是棄其師也
